<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0926" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes moveTimeline {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes playhead {
      0% { transform: translateX(0px); }
      100% { transform: translateX(1000px); }
    }
    .timeline-bar { animation: moveTimeline 8s ease-in-out infinite; }
    .glowing-orb { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .playhead-line { animation: playhead 10s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs (Background Layer) -->
  <circle class="glowing-orb" cx="150" cy="80" r="180" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1050" cy="280" r="200" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Abstract Video Timeline Waveforms (Decorative Background Graphic) -->
  <g opacity="0.25" class="timeline-bar">
    <!-- Video Track 1 -->
    <rect x="50" y="270" width="220" height="24" rx="6" fill="#6366f1" />
    <rect x="280" y="270" width="340" height="24" rx="6" fill="#818cf8" />
    <rect x="630" y="270" width="180" height="24" rx="6" fill="#a855f7" />
    <rect x="820" y="270" width="330" height="24" rx="6" fill="#ec4899" />
    
    <!-- Audio Track 2 -->
    <rect x="50" y="302" width="410" height="18" rx="4" fill="#38bdf8" />
    <rect x="470" y="302" width="290" height="18" rx="4" fill="#818cf8" />
    <rect x="770" y="302" width="380" height="18" rx="4" fill="#c084fc" />
  </g>

  <!-- Moving Playhead Line -->
  <g opacity="0.4">
    <line class="playhead-line" x1="100" y1="240" x2="100" y2="330" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 2" />
  </g>

  <!-- Foreground Content Grid / Cards -->
  <!-- Header Badges -->
  <g transform="translate(80, 45)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#334155" opacity="0.8" />
    <text x="16" y="18" class="badge-text" fill="#38bdf8">🎬 SaaS &amp; NLEs</text>

    <rect x="150" y="0" width="165" height="28" rx="14" fill="#334155" opacity="0.8" />
    <text x="166" y="18" class="badge-text" fill="#a855f7">⚡ Open-Source</text>

    <rect x="325" y="0" width="170" height="28" rx="14" fill="#334155" opacity="0.8" />
    <text x="341" y="18" class="badge-text" fill="#f43f5e">🎨 Post-Production</text>
  </g>

  <!-- Title Section (Foreground) -->
  <text x="80" y="130" class="title-text" font-size="44" letter-spacing="-0.5">Awesome Video Editing Software</text>
  
  <!-- Accent Line under Title -->
  <rect x="80" y="148" width="540" height="5" rx="2.5" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="80" y="188" class="subtitle-text" font-size="20">
    A curated landscape of commercial NLE SaaS platforms &amp; open-source post-production tools.
  </text>
  
  <!-- Key Metrics / Feature Pill Highlights -->
  <g transform="translate(80, 215)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="25" cy="21" r="10" fill="#6366f1" opacity="0.2" />
      <text x="25" y="25" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#818cf8">💰</text>
      <text x="45" y="26" class="badge-text">SaaS Market Pricing</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="230" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="25" cy="21" r="10" fill="#a855f7" opacity="0.2" />
      <text x="25" y="25" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#c084fc">⭐</text>
      <text x="45" y="26" class="badge-text">GitHub Star Rankings</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="240" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="25" cy="21" r="10" fill="#ec4899" opacity="0.2" />
      <text x="25" y="25" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#f472b6">📊</text>
      <text x="45" y="26" class="badge-text">Industry Valuation Data</text>
    </g>
  </g>
</svg>
